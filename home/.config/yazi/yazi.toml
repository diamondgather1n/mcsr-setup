[opener]
edit = [
  { run = 'micro "$@"', block = true, for = "unix", desc = "micro" },
]
image = [
  { run = 'imv "$@"', orphan = true, for = "unix", desc = "imv" },
]
edit_image = [
  { run = 'gimp "$@"', orphan = true, for = "unix", desc = "Edit image with GIMP" },
]
media = [
  { run = 'mpv "$@"', orphan = true, for = "unix", desc = "mpv" },
]
edit_video = [
  { run = 'shotcut "$@"', orphan = true, for = "unix", desc = "Edit video with Shotcut" },
]
browser = [
  { run = 'helium-browser "$@"', orphan = true, for = "unix", desc = "Helium" },
]
folder = [
  { run = 'yazi "$@"', block = true, for = "unix", desc = "Yazi" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/xml", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.conf", use = "edit" },
  { url = "*.sh", use = "edit" },
  { mime = "image/*", use = ["image", "edit_image"] },
  { mime = "video/*", use = ["media", "edit_video"] },
  { mime = "audio/*", use = "media" },
  { mime = "application/pdf", use = "browser" },
  { mime = "text/html", use = "browser" },
  { mime = "inode/directory", use = "folder" },
]
